name: Content Audit Schedule

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  schedule:
    - cron: "7 15 * * 1"

jobs:
  content-audit-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load previous selection history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh run list --workflow content-audit-schedule.yml --branch "${{ github.ref_name }}" --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
          if [ -n "$previous_run" ]; then
            mkdir -p previous-audit
            if gh run download "$previous_run" --name content-audit-schedule --dir previous-audit; then
              cp previous-audit/content_audit_selection_history.csv . 2>/dev/null || true
            fi
          fi

      - name: Write service account key
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}' > gsc-key.json

      - name: Run content audit schedule
        env:
          GSC_PROPERTY: "https://www.cim.org/"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_ITEM_ID: ${{ secrets.MONDAY_CONTENT_AUDIT_ITEM_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python -u content_audit_schedule_report.py

      - name: Finalize reporting artifacts
        if: always()
        run: python -u finalize_report.py --report-name "Content Audit Schedule"

      - name: Upload content audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-audit-schedule
          path: |
            report_manifest.json
            reporting_quality_warnings.csv
            reporting_artifact_index.html
            normalized/
            content_audit_config.csv
            content_audit_page_comparison.csv
            content_audit_candidates.csv
            content_audit_selection.csv
            content_audit_selection_history.csv
            content_audit_selection_followup.csv
            report_period.json
            content_audit_top_candidates.png
            content_audit_candidate_impressions.png
            content_audit_candidate_clicks.png
            content_audit_selected_score.png
            content_audit_schedule_summary.md
            content_audit_schedule_summary.html
            content_audit_schedule_summary_final.html

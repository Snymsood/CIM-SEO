name: Master Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1" # Runs at 15:00 UTC on Mondays

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  master-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Download previous site speed history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_RUN_ID="$(gh run list --workflow master-orchestrator.yml --branch "${{ github.ref_name }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            gh run download "$PREVIOUS_RUN_ID" --name site-speed-monitoring --dir . || echo "No previous site-speed-monitoring artifact found."
          else
            echo "No previous successful master run found."
          fi

      - name: Write service account key
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}' > gsc-key.json

      - name: Run Master Orchestrator
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MONDAY_GSC_ITEM_ID: ${{ secrets.MONDAY_GSC_ITEM_ID || secrets.MONDAY_ITEM_ID }}
          MONDAY_GA4_WEEKLY_ITEM_ID: ${{ secrets.MONDAY_GA4_WEEKLY_ITEM_ID }}
          MONDAY_SITE_SPEED_ITEM_ID: ${{ secrets.MONDAY_SITE_SPEED_ITEM_ID }}
          MONDAY_AI_SNIPPET_ITEM_ID: ${{ secrets.MONDAY_AI_SNIPPET_ITEM_ID }}
          MONDAY_MASTER_ITEM_ID: ${{ secrets.MONDAY_MASTER_ITEM_ID }}
          MONDAY_GSC_KEYWORD_ITEM_ID: ${{ secrets.MONDAY_GSC_KEYWORD_ITEM_ID }}
          MONDAY_GSC_LANDING_ITEM_ID: ${{ secrets.MONDAY_GSC_LANDING_ITEM_ID }}
          MONDAY_BROKEN_LINK_ITEM_ID: ${{ secrets.MONDAY_BROKEN_LINK_ITEM_ID }}
          MONDAY_INTERNAL_LINK_ITEM_ID: ${{ secrets.MONDAY_INTERNAL_LINK_ITEM_ID }}
          MONDAY_CONTENT_AUDIT_ITEM_ID: ${{ secrets.MONDAY_CONTENT_AUDIT_ITEM_ID }}
          MONDAY_CONTENT_CATEGORY_ITEM_ID: ${{ secrets.MONDAY_CONTENT_CATEGORY_ITEM_ID }}
          MONDAY_INTELLIGENCE_ITEM_ID: ${{ secrets.MONDAY_INTELLIGENCE_ITEM_ID }}
          MONDAY_EVENT_REPORT_ITEM_ID: ${{ secrets.MONDAY_EVENT_REPORT_ITEM_ID }}
        run: python -u master_orchestrator.py

      - name: Upload Master Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: master-orchestrator-artifacts
          path: |
            *.csv
            *.html
            *.pdf
            reports/
            screenshots/
            evidence/
            charts/

      - name: Upload site speed history
        uses: actions/upload-artifact@v4
        with:
          name: site-speed-monitoring
          path: |
            tracked_speed_pages.csv
            site_speed_current_snapshot.csv
            site_speed_comparison.csv
            site_speed_opportunities.csv
            site_speed_latest_snapshot.csv
            site_speed_history.csv
            site_speed_summary.html
            site_speed_summary_final.html
            site_speed_charts/
          if-no-files-found: warn

      - name: Remove service account key before publishing
        if: always()
        run: rm -f gsc-key.json

      - name: Prepare Pages site
        run: |
          mkdir -p public_site
          find . -maxdepth 1 -type f \( -name '*.csv' -o -name '*.html' -o -name '*.pdf' -o -name '*.png' \) -exec cp {} public_site/ \;
          for dir in reports screenshots evidence charts; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "public_site/$dir"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: master-orchestrator
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Monthly SEO Master Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *" # Runs at 9:00 AM UTC on the 1st of each month

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  monthly-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Write service account key
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}' > gsc-key.json

      - name: Download latest individual weekly artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_latest_artifact() {
            workflow="$1"
            artifact="$2"
            run_id="$(gh run list --workflow "$workflow" --branch "${{ github.ref_name }}" --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then
              tmp_dir="downloaded-${artifact}"
              rm -rf "$tmp_dir"
              mkdir -p "$tmp_dir"
              if gh run download "$run_id" --name "$artifact" --dir "$tmp_dir"; then
                cp -Rf "$tmp_dir"/. .
              else
                echo "Artifact $artifact not available from $workflow."
              fi
            else
              echo "No successful run found for $workflow."
            fi
          }

          download_latest_artifact gsc-weekly-report.yml gsc-weekly-report
          download_latest_artifact ga4-weekly-report.yml ga4-weekly-report
          download_latest_artifact keyword-ranking-review.yml keyword-ranking-review
          download_latest_artifact critical-landing-pages.yml critical-landing-pages
          download_latest_artifact site-speed-monitoring.yml site-speed-monitoring
          download_latest_artifact broken-link-check.yml broken-link-check
          download_latest_artifact internal-linking-audit.yml internal-linking-audit
          download_latest_artifact content-audit-schedule.yml content-audit-schedule
          download_latest_artifact content-category-performance.yml content-category-performance
          download_latest_artifact ga4-event-report.yml ga4-event-report
          download_latest_artifact ai-snippet-verification.yml ai-snippet-verification-report
          download_latest_artifact weekly-seo-intelligence.yml weekly-seo-intelligence

      - name: Run site speed monitoring (if no snapshot available)
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          if [ ! -f site_speed_latest_snapshot.csv ]; then
            echo "No snapshot found — running site_speed_monitoring.py"
            python -u site_speed_monitoring.py
          else
            echo "Snapshot found — skipping site_speed_monitoring.py"
          fi

      - name: Run broken link check (if no results available)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          if [ ! -f broken_link_results.csv ]; then
            echo "No broken link results found — running broken_link_check.py"
            python -u broken_link_check.py
          else
            echo "Broken link results found — skipping broken_link_check.py"
          fi

      - name: Run internal linking audit (if no results available)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          if [ ! -f internal_linking_page_summary.csv ]; then
            echo "No internal linking data found — running internal_linking_audit.py"
            python -u internal_linking_audit.py
          else
            echo "Internal linking data found — skipping internal_linking_audit.py"
          fi

      - name: Run content audit (if no results available)
        env:
          GSC_PROPERTY: "https://www.cim.org/"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          if [ ! -f content_audit_candidates.csv ]; then
            echo "No content audit data found — running content_audit_schedule_report.py"
            python -u content_audit_schedule_report.py
          else
            echo "Content audit data found — skipping content_audit_schedule_report.py"
          fi

      - name: Run content category performance (if no results available)
        env:
          GSC_PROPERTY: "https://www.cim.org/"
          GA4_PROPERTY_ID: "341629008"
        run: |
          if [ ! -f content_category_performance.csv ]; then
            echo "No content category data found — running content_category_performance.py"
            python -u content_category_performance.py
          else
            echo "Content category data found — skipping content_category_performance.py"
          fi

      - name: Run AI snippet verification (if no results available)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: |
          if [ ! -f reports/ai_snippet_verification.csv ]; then
            echo "No AI snippet data found — running ai_snippet_verification.py"
            python -u ai_snippet_verification.py
          else
            echo "AI snippet data found — skipping ai_snippet_verification.py"
          fi
          if [ ! -f reports/ai_snippet_verification_report_final.html ]; then
            echo "No AI snippet HTML report found — running ai_snippet_pdf_report.py"
            python -u ai_snippet_pdf_report.py
          else
            echo "AI snippet HTML report found — skipping ai_snippet_pdf_report.py"
          fi

      - name: Run Monthly Master Report
        env:
          GA4_PROPERTY_ID: "341629008"
          GSC_PROPERTY: "https://www.cim.org/"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_MONTHLY_ITEM_ID: ${{ secrets.MONDAY_MONTHLY_ITEM_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python -u monthly_master_report.py

      - name: Upload Monthly Dashboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monthly-dashboard-artifacts
          path: |
            monthly_dashboard.html
            monthly_data/*.csv
            charts/monthly_*.png
          retention-days: 90

      - name: Archive Monthly Dashboard
        run: |
          MONTH=$(date -d "last month" +%Y-%m)
          mkdir -p archives/$MONTH
          cp monthly_dashboard.html archives/$MONTH/
          cp -r monthly_data archives/$MONTH/
          echo "Archived dashboard for $MONTH"

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: monthly-dashboard-archive
          path: archives/
          retention-days: 365

      - name: Copy Dashboard to Root for GitHub Pages
        run: |
          # Copy the dashboard to root so it's accessible via GitHub Pages
          cp monthly_dashboard.html index.html
          echo "Dashboard copied to index.html for GitHub Pages"

  deploy:
    name: Deploy to GitHub Pages
    needs: monthly-dashboard
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Dashboard Artifacts
        uses: actions/download-artifact@v4
        with:
          name: monthly-dashboard-artifacts
          path: .

      - name: Prepare Pages site
        run: |
          mkdir -p monthly_public
          cp monthly_dashboard.html monthly_public/index.html
          if [ -d monthly_data ]; then
            cp -R monthly_data monthly_public/monthly_data
          fi
          if [ -d charts ]; then
            mkdir -p monthly_public/charts
            find charts -maxdepth 1 -type f -name 'monthly_*.png' -exec cp {} monthly_public/charts/ \;
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "monthly_public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

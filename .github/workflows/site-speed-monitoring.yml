name: Site Speed Monitoring

on:
  workflow_dispatch:
#  schedule:
#    - cron: "45 13 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  site-speed-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}' > gsc-key.json

      - name: Download previous site speed history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_RUN_ID="$(gh run list --workflow site-speed-monitoring.yml --branch "${{ github.ref_name }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$PREVIOUS_RUN_ID" ]; then
            gh run download "$PREVIOUS_RUN_ID" --name site-speed-monitoring --dir . || echo "No previous site-speed-monitoring artifact found."
          else
            echo "No previous successful site speed run found."
          fi

      - name: Run site speed monitoring
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_ITEM_ID: ${{ secrets.MONDAY_SITE_SPEED_ITEM_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python -u site_speed_monitoring.py

      - name: Upload site speed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-speed-monitoring
          path: |
            tracked_speed_pages.csv
            site_speed_current_snapshot.csv
            site_speed_comparison.csv
            site_speed_opportunities.csv
            site_speed_latest_snapshot.csv
            site_speed_history.csv
            site_speed_summary.html
            site_speed_summary_final.html
            site_speed_charts/

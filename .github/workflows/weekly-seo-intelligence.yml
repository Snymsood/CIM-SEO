name: Weekly SEO Intelligence

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Build reports without posting to Monday or sending email"
        type: boolean
        default: false
      delivery_only:
        description: "Retry email from a prior run without rebuilding reports"
        type: boolean
        default: false
      source_run_id:
        description: "Prior intelligence run ID for delivery_only"
        type: string
        default: ""
  schedule:
    - cron: "11 18 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  weekly-seo-intelligence:
    if: ${{ !inputs.delivery_only }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load previous KPI history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh run list --workflow weekly-seo-intelligence.yml --branch "${{ github.ref_name }}" --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
          if [ -n "$previous_run" ]; then
            mkdir -p previous-intelligence
            if gh run download "$previous_run" --name weekly-seo-intelligence --dir previous-intelligence; then
              cp previous-intelligence/weekly_trend_history.csv weekly_trend_history.csv 2>/dev/null || true
            fi
          fi

      - name: Download weekly report artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_latest_artifact() {
            workflow="$1"
            artifact="$2"
            run_id="$(gh run list --workflow "$workflow" --branch "${{ github.ref_name }}" --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
            if [ -n "$run_id" ]; then
              tmp_dir="downloaded-${artifact}"
              rm -rf "$tmp_dir"
              mkdir -p "$tmp_dir"
              if gh run download "$run_id" --name "$artifact" --dir "$tmp_dir" && python validate_source_artifact.py "$tmp_dir" "$artifact" "$run_id"; then
                rm -f "$tmp_dir"/report_manifest.json "$tmp_dir"/report_period.json "$tmp_dir"/report_delivery_status.json "$tmp_dir"/reporting_quality_warnings.csv "$tmp_dir"/reporting_artifact_index.html
                cp -Rf "$tmp_dir"/. .
              else
                echo "Artifact $artifact missing or stale from $workflow."
              fi
            else
              echo "No successful run found for $workflow."
            fi
          }

          download_latest_artifact gsc-weekly-report.yml gsc-weekly-report
          download_latest_artifact ga4-weekly-report.yml ga4-weekly-report
          download_latest_artifact keyword-ranking-review.yml keyword-ranking-review
          download_latest_artifact critical-landing-pages.yml critical-landing-pages
          download_latest_artifact site-speed-monitoring.yml site-speed-monitoring
          download_latest_artifact broken-link-check.yml broken-link-check
          download_latest_artifact internal-linking-audit.yml internal-linking-audit
          download_latest_artifact content-audit-schedule.yml content-audit-schedule
          download_latest_artifact content-category-performance.yml content-category-performance
          download_latest_artifact ai-snippet-verification.yml ai-snippet-verification-report
          download_latest_artifact mailchimp-weekly-report.yml mailchimp-weekly-report
          download_latest_artifact content-strategy-report.yml content-strategy-report

      - name: Download validated four-site portfolio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow site-source-portfolio.yml --branch "${{ github.ref_name }}" --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
          if [ -n "$run_id" ]; then
            mkdir -p portfolio_sources
            if gh run download "$run_id" --name site-source-portfolio --dir portfolio_sources && python validate_source_artifact.py portfolio_sources site-source-portfolio "$run_id"; then
              echo "Validated site-source-portfolio run $run_id."
            else
              echo "Site portfolio artifact is missing or from another week."
              rm -rf portfolio_sources
            fi
          else
            echo "No successful site portfolio run found."
          fi

      - name: Write service account key
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}' > gsc-key.json

      - name: Run weekly intelligence
        env:
          ENABLE_WEEKLY_INTELLIGENCE: "true"
          ENABLE_AI_ACTION_PLAN: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_INTELLIGENCE_ITEM_ID: ${{ secrets.MONDAY_INTELLIGENCE_ITEM_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PREVIEW_ONLY: ${{ inputs.preview_only || false }}
        run: |
          if [ "$PREVIEW_ONLY" = "true" ]; then
            python -u weekly_seo_intelligence.py --dry-run
          else
            python -u weekly_seo_intelligence.py
          fi

      - name: Build personal weekly action report
        run: python -u weekly_personal_action_report.py

      - name: Email personal weekly action report
        if: ${{ !inputs.preview_only }}
        env:
          SEO_ACTION_DELIVERY_MODE: ${{ vars.SEO_ACTION_DELIVERY_MODE || 'smtp' }}
          SEO_ACTION_APPS_SCRIPT_URL: ${{ secrets.SEO_ACTION_APPS_SCRIPT_URL }}
          SEO_ACTION_APPS_SCRIPT_TOKEN: ${{ secrets.SEO_ACTION_APPS_SCRIPT_TOKEN }}
          SEO_ACTION_REPORT_TO: ${{ secrets.SEO_ACTION_REPORT_TO }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_AUDIENCE_ID: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
          SEO_REPORT_SMTP_USER: ${{ secrets.SEO_REPORT_SMTP_USER || secrets.SEO_ACTION_REPORT_TO }}
          SEO_REPORT_SMTP_PASSWORD: ${{ secrets.SEO_REPORT_SMTP_PASSWORD }}
          SEO_REPORT_SMTP_HOST: ${{ vars.SEO_REPORT_SMTP_HOST || 'smtp.gmail.com' }}
          SEO_REPORT_SMTP_PORT: ${{ vars.SEO_REPORT_SMTP_PORT || '465' }}
        run: |
          if [ "$SEO_ACTION_DELIVERY_MODE" = "mailchimp_test" ]; then
            python -u send_weekly_action_mailchimp.py
          elif [ "$SEO_ACTION_DELIVERY_MODE" = "google_apps_script" ]; then
            python -u send_weekly_action_webhook.py
          else
            python -u send_weekly_action_email.py
          fi

      - name: Mark preview email as skipped
        if: ${{ inputs.preview_only }}
        run: python -c 'import json; from pathlib import Path; Path("personal_email_delivery_status.json").write_text(json.dumps({"status":"skipped","detail":"manual preview"}, indent=2))'

      - name: Finalize reporting artifacts
        if: always()
        run: python -u finalize_report.py --report-name "Weekly SEO Intelligence"

      - name: Upload intelligence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-seo-intelligence
          path: |
            report_manifest.json
            reporting_quality_warnings.csv
            reporting_artifact_index.html
            normalized/
            weekly_seo_action_queue.csv
            weekly_seo_action_queue.json
            weekly_seo_anomalies.csv
            weekly_content_decay_candidates.csv
            weekly_seo_intelligence_report.html
            weekly_trends.csv
            site_portfolio_trends.csv
            search_query_page_opportunities.csv
            weekly_trend_history.csv
            source_report_runs.json
            weekly_seo_intelligence_summary.json
            weekly_seo_intelligence_ai_recommendations.md
            weekly_personal_action_report.html
            weekly_personal_action_report.txt
            weekly_personal_action_report.json
            personal_email_delivery_status.json
            outputs/weekly_intelligence.json
          retention-days: 90

  retry-personal-email:
    if: ${{ inputs.delivery_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and verify prior personal report
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ -z "$SOURCE_RUN_ID" ]; then
            echo "source_run_id is required for delivery_only"
            exit 1
          fi
          mkdir -p saved-report
          gh run download "$SOURCE_RUN_ID" --name weekly-seo-intelligence --dir saved-report
          python - "$SOURCE_RUN_ID" <<'PY'
          import json
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          source_run_id = sys.argv[1]
          root = Path("saved-report")
          manifest = json.loads((root / "report_manifest.json").read_text())
          report = json.loads((root / "weekly_personal_action_report.json").read_text())
          delivery = json.loads((root / "personal_email_delivery_status.json").read_text())
          today = datetime.now(timezone.utc).date()
          days_since_sunday = (today.weekday() + 1) % 7 or 7
          end = today - timedelta(days=days_since_sunday)
          expected = f"{end - timedelta(days=6)}_{end}"
          if str(manifest.get("run_id")) != source_run_id or report.get("period_id") != expected:
              raise SystemExit("Prior report run or reporting period does not match this week")
          if delivery.get("status") != "failed":
              raise SystemExit("Only a failed email delivery can be retried")
          PY

      - name: Retry personal weekly action email
        env:
          SEO_ACTION_DELIVERY_MODE: ${{ vars.SEO_ACTION_DELIVERY_MODE || 'smtp' }}
          SEO_ACTION_APPS_SCRIPT_URL: ${{ secrets.SEO_ACTION_APPS_SCRIPT_URL }}
          SEO_ACTION_APPS_SCRIPT_TOKEN: ${{ secrets.SEO_ACTION_APPS_SCRIPT_TOKEN }}
          SEO_ACTION_REPORT_TO: ${{ secrets.SEO_ACTION_REPORT_TO }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_AUDIENCE_ID: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
          SEO_REPORT_SMTP_USER: ${{ secrets.SEO_REPORT_SMTP_USER || secrets.SEO_ACTION_REPORT_TO }}
          SEO_REPORT_SMTP_PASSWORD: ${{ secrets.SEO_REPORT_SMTP_PASSWORD }}
          SEO_REPORT_SMTP_HOST: ${{ vars.SEO_REPORT_SMTP_HOST || 'smtp.gmail.com' }}
          SEO_REPORT_SMTP_PORT: ${{ vars.SEO_REPORT_SMTP_PORT || '465' }}
        run: |
          if [ "$SEO_ACTION_DELIVERY_MODE" = "mailchimp_test" ]; then
            python -u send_weekly_action_mailchimp.py --root saved-report
          elif [ "$SEO_ACTION_DELIVERY_MODE" = "google_apps_script" ]; then
            python -u send_weekly_action_webhook.py --root saved-report
          else
            python -u send_weekly_action_email.py --root saved-report
          fi

      - name: Upload retry status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-email-delivery-retry
          path: saved-report/personal_email_delivery_status.json
          retention-days: 90

name: Internal Linking Audit

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  schedule:
    - cron: "37 14 * * 1"

jobs:
  internal-linking-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load previous priority history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh run list --workflow internal-linking-audit.yml --branch "${{ github.ref_name }}" --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
          if [ -n "$previous_run" ]; then
            mkdir -p previous-internal
            if gh run download "$previous_run" --name internal-linking-audit --dir previous-internal; then
              cp previous-internal/internal_linking_priority_history.csv . 2>/dev/null || true
            fi
          fi

      - name: Write service account key
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}' > gsc-key.json

      - name: Run internal linking audit
        run: python -u internal_linking_audit.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_ITEM_ID: ${{ secrets.MONDAY_INTERNAL_LINK_ITEM_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Finalize reporting artifacts
        if: always()
        run: python -u finalize_report.py --report-name "Internal Linking Audit"

      - name: Upload internal linking artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-linking-audit
          path: |
            report_manifest.json
            reporting_quality_warnings.csv
            reporting_artifact_index.html
            normalized/
            internal_linking_config.csv
            internal_linking_crawled_pages.csv
            internal_linking_discovered_links.csv
            internal_linking_page_summary.csv
            internal_linking_flagged_pages.csv
            internal_linking_priority_targets.csv
            internal_linking_priority_history.csv
            internal_linking_generic_anchor_examples.csv
            internal_linking_opportunities.csv
            internal_linking_low_outlinks.png
            internal_linking_low_inlinks.png
            internal_linking_priority_targets.png
            internal_linking_audit_summary.md
            internal_linking_audit_summary.html
            internal_linking_audit_summary_final.html

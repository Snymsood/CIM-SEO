name: Broken Link Check

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  schedule:
    - cron: "7 14 * * 1"

jobs:
  broken-link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load previous link status and issue history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh run list --workflow broken-link-check.yml --branch "${{ github.ref_name }}" --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
          if [ -n "$previous_run" ]; then
            mkdir -p previous-links
            if gh run download "$previous_run" --name broken-link-check --dir previous-links; then
              cp previous-links/link_target_status_cache.csv . 2>/dev/null || true
              cp previous-links/broken_link_issue_history.csv . 2>/dev/null || true
            fi
          fi

      - name: Write service account key
        run: echo '${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}' > gsc-key.json

      - name: Run broken link check
        run: python -u broken_link_check.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_ITEM_ID: ${{ secrets.MONDAY_BROKEN_LINK_ITEM_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      - name: Finalize reporting artifacts
        if: always()
        run: python -u finalize_report.py --report-name "Broken Link Check"

      - name: Upload broken link artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-link-check
          path: |
            report_manifest.json
            reporting_quality_warnings.csv
            reporting_artifact_index.html
            normalized/
            broken_link_seed_domains.csv
            discovered_internal_links.csv
            broken_link_results.csv
            broken_link_issues_only.csv
            broken_link_unique_issues.csv
            broken_link_issue_history.csv
            link_target_status_cache.csv
            broken_link_summary.html
            broken_link_summary_final.html
            charts/

name: Weekly Source Report Schedule Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "37 20 * * 1"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-weekly-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch backfill when source reports are missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          since="$(date -u +%Y-%m-%dT00:00:00Z)"
          until="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          range="${since}..${until}"
          branch="${{ github.ref_name }}"
          missing_reports=""

          note_if_missing() {
            workflow="$1"
            label="$2"
            count="$(gh run list \
              --workflow "$workflow" \
              --branch "$branch" \
              --created "$range" \
              --limit 50 \
              --json event,status,conclusion \
              --jq '[.[] | select((.event == "schedule" or .event == "workflow_dispatch") and (.status != "completed" or .conclusion == "success"))] | length')"

            if [ "$count" -eq 0 ]; then
              echo "No successful or active run found today for ${label}."
              missing_reports="${missing_reports}${label}; "
            else
              echo "Found ${count} run(s) today for ${label}; no backup dispatch needed."
            fi
          }

          note_if_missing gsc-weekly-report.yml "GSC Weekly Report"
          note_if_missing keyword-ranking-review.yml "Keyword Ranking Review"
          note_if_missing critical-landing-pages.yml "Critical Landing Pages"
          note_if_missing site-speed-monitoring.yml "Site Speed Monitoring"
          note_if_missing broken-link-check.yml "Broken Link Check"
          note_if_missing ga4-weekly-report.yml "GA4 Weekly Report"
          note_if_missing internal-linking-audit.yml "Internal Linking Audit"
          note_if_missing ga4-event-report.yml "GA4 Event Report"
          note_if_missing content-audit-schedule.yml "Content Audit"
          note_if_missing content-category-performance.yml "Content Category Performance"
          note_if_missing ai-snippet-verification.yml "AI Snippet Verification"
          note_if_missing mailchimp-weekly-report.yml "Mailchimp Weekly Content Report"

          backfill_count="$(gh run list \
            --workflow weekly-report-backfill.yml \
            --branch "$branch" \
            --created "$range" \
            --limit 20 \
            --json event,status,conclusion \
            --jq '[.[] | select((.event == "schedule" or .event == "workflow_dispatch") and (.status != "completed" or .conclusion == "success"))] | length')"

          if [ -n "$missing_reports" ] && [ "$backfill_count" -eq 0 ]; then
            echo "Dispatching Weekly Report Backfill for missing reports: ${missing_reports}"
            gh workflow run weekly-report-backfill.yml --ref "$branch"
          elif [ -n "$missing_reports" ]; then
            echo "Weekly Report Backfill already has a successful or active run today."
          else
            echo "All source reports have successful or active runs today."
          fi

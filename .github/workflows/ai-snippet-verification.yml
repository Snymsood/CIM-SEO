name: AI Snippet Verification

permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: "37 15 * * 1"
  workflow_dispatch:

jobs:
  ai-snippet-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Load previous proxy scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh run list --workflow ai-snippet-verification.yml --branch "${{ github.ref_name }}" --status completed --limit 10 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
          if [ -n "$previous_run" ]; then
            mkdir -p previous-snippet
            if gh run download "$previous_run" --name ai-snippet-verification-report --dir previous-snippet; then
              cp previous-snippet/reports/ai_snippet_verification.csv previous_ai_snippet.csv 2>/dev/null || true
            fi
          fi

      - name: Run AI snippet verification
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_AI_SNIPPET_ITEM_ID: ${{ secrets.MONDAY_AI_SNIPPET_ITEM_ID }}
        run: python -u ai_snippet_verification.py

      - name: Generate HTML report and upload to Monday
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_ITEM_ID: ${{ secrets.MONDAY_AI_SNIPPET_ITEM_ID }}
        run: python -u ai_snippet_pdf_report.py

      - name: Finalize reporting artifacts
        if: always()
        run: python -u finalize_report.py --report-name "AI Snippet Verification"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-snippet-verification-report
          path: |
            report_manifest.json
            reporting_quality_warnings.csv
            reporting_artifact_index.html
            normalized/
            reports/
            screenshots/
            evidence/
            charts/
